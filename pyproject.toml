[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptohauntological"
version = "0.1.0"
description = "Does a model that lost the rule keep obeying it somewhere else?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
cryptohaunt = "cryptohaunt.cli:main"

[tool.setuptools]
packages = ["cryptohaunt"]
